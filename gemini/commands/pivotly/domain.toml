    }
  ]
}
```

### `create` — `POST /v3/config-items/domain`

Create a new domain config item (create-only; use `update` for changes). ⚠️ Creates a config record; nothing goes live until publish. **Confirm first** (show slug, columns, flags).

| Input                                                           | Required | Notes                                                                   |
| --------------------------------------------------------------- | -------- | ----------------------------------------------------------------------- |
| `slug`                                                          | yes      | 1–50 chars; unique; must not start with `sys_`, `dvw_`, `dtm_`, `dtv_`. |
| `cfg_data`                                                      | yes      | Full required set above; `domain_table_name` = `slug`.                  |
| `name`, `description`, `enabled`, `parent_item_id`, `full_path` | no       | See property table. Omit `version` (starts at 1).                       |

Output `201`: `data: { id, slug, version: 1 }` — keep `id` (for `update` / `delete_config_item` / `get`) and `slug` (for `publish`).

Errors → action: **400** request shape (missing `slug`/`cfg_data`, oversize field, id on create) → fix and retry. **403** → tell the user they lack `domain.create`. **5xx with message "Validation failed"** (code `INVALID`) → read `data.details` (`{path, code, detail, severity}` per problem), fix those paths, retry. **5xx whose message says the slug already exists** → do not retry; offer to `get_by_slug` and `update` the existing domain instead.

```json
{
  "operation": "create",
  "slug": "products",
  "name": "Products",
  "description": "Product master data",
  "cfg_data": { "…": "minimal cfg_data above" }
}
```

### `update` — `PATCH /v3/config-items/domain/{id}`

Change an existing domain config item; produces a new version. ⚠️ New config version; live structures unchanged until publish. **Confirm first.**

| Input                                                                      | Required | Notes                                                                                                                                                                                                                                                                                   |
| -------------------------------------------------------------------------- | -------- | --------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| `id`                                                                       | yes      | Config-item uuid (from `create`, `get_by_slug`, `list`, `filter`).                                                                                                                                                                                                                      |
| `cfg_data`                                                                 | no       | Authoring convention: **send the complete `cfg_data`** — read it with `get_by_slug`, apply the change, send the whole object. The reference says only included fields change, but does not say whether the merge is deep inside `cfg_data`, and the validator checks the whole payload. |
| `name`, `description`, `enabled`, `parent_item_id`, `full_path`, `version` | no       |                                                                                                                                                                                                                                                                                         |
| `slug`                                                                     | no       | ⚠️ Renaming a slug that has been published is rejected (`IMMUTABLE_SLUG`).                                                                                                                                                                                                              |

Output `200`: `data: { id, slug, version }` (version incremented).

Errors → action: **400** (`id` in body ≠ path, request shape) → fix. **403** → lacks `domain.change`. **404** → id not found; re-find with `get_by_slug`. **5xx `INVALID`** → fix `data.details` paths. **5xx message containing `IMMUTABLE_SLUG`** → stop; a published domain's slug cannot be renamed — the user must create a new domain instead. **5xx item-type change** → not applicable to this tool; report the message.

```json
{
  "operation": "update",
  "id": "65eb81bf-0a01-405b-b443-ffe3e68bf48e",
  "cfg_data": { "…": "complete cfg_data with the new column appended to schema" }
}
```

### `delete_config_item` — `DELETE /v3/config-items/domain/{id}`

Soft-delete the config item (marks it deleted and disabled). ⚠️ Removes the configuration record only — **does not drop a published domain's live data structures** (that is `delete_published`). **Confirm first.**

Input: `id` (required). Output `200`: `data: { id, slug, version }`. Errors: **403**, **404**.

```json
{ "operation": "delete_config_item", "id": "65eb81bf-0a01-405b-b443-ffe3e68bf48e" }
```

### `get` — `GET /v3/config-items/domain/{id}` · `get_by_slug` — `GET /v3/config-items/domain/by-slug/{slug}`

Read one domain config item. Read-only.

Input: `id` for `get`; `slug` for `get_by_slug`. Output `200`: the full config item — `{ id, slug, itemType, version, name, enabled, cfgData }` (**camelCase in responses**). `cfgData.schema` is the column list; `id` feeds `update` / `delete_config_item`; `version` is the current config version. Errors: **403**, **404** (a 404 on `get_by_slug` means the slug is free / the domain does not exist).

```json
{ "operation": "get_by_slug", "slug": "products" }
```

### `list` — `GET /v3/config-items/domain`

Paginated list of domain config items. Read-only.

Inputs (all optional): `fetchType`, `page` (0-based), `pageSize` (1–100), `slugContains`, `search`, `sortModel`, `filterModel`. Filter operators: `contains` `doesNotContain` `equals` `doesNotEqual` `startsWith` `endsWith` `isEmpty` `isNotEmpty` `is` `not` `isAnyOf` `=` `!=` `>` `>=` `<` `<=` `after` `before` `onOrAfter` `onOrBefore`.

Output `200`: `data` = array of config items; `pagination: { page, page_size, total_records, count_mode }`. Errors: **403**.

```json
{
  "operation": "list",
  "page": 0,
  "pageSize": 25,
  "slugContains": "prod",
  "sortModel": [{ "field": "slug", "sort": "asc" }],
  "filterModel": { "items": [{ "field": "enabled", "operator": "is", "value": true }], "logicOperator": "and" }
}
```

### `filter` — `GET /v3/config-items?itemType=domain`

Alternate list filtered by explicit columns. Read-only. The tool fixes `itemType=domain`; you **must supply at least one** of `id`, `version`, `enabled`, `name`, `description`, `slug`, `fullPath`, `depth`, `createdBy`, `modifiedBy`, `parentItemId`, `isDeleted` (else **400**). Paging: `page` (≥1, default 1 — **1-based here**), `limit` (≤100, default 25).

Output `200`: `data` = array of matching config items. Errors: **400** (no filter), **403**.

```json
{ "operation": "filter", "enabled": true, "isDeleted": false, "page": 1, "limit": 50 }
```

### `publish` — `POST /v3/domain-publish/{slug}`

Publish the latest **saved** configuration, materializing or refreshing the domain's data structures. Runs publish → prune → archive. ⚠️ Changes live data structures. **Confirm first — user policy** (state slug, prior-publish status, and what publish does).

Input: `slug` (required). Before calling, `get_by_slug` to confirm the config exists (a missing config surfaces as a 5xx, not a 404).

Output `200`: `data: { response, pub_id, slug, statuses: { publish, prune, archive }, step_responses: { publish, prune, archive }, has_warnings }`. Check every `statuses.*` value and `has_warnings`; a `200` with `has_warnings: true` completed **with warnings** — report them from `step_responses` / `response`. Keep `pub_id` for `get_publication`.

Errors → action: **400** code `VALIDATION` (the saved config is missing `slug` and/or `cfg_data` — not publishable) → inspect with `get_by_slug`, fix via `update`. **403** → lacks `domain.publish`. **5xx code `CFG_NOT_FOUND` / "configuration not found"** → no saved config for that slug; check the slug with `get_by_slug` / `list`; do not retry blindly. Any other 5xx → read `message` before deciding; ask before retrying.

```json
{ "operation": "publish", "slug": "products" }
```

### Publication reads — all read-only, `domain.view`

| Operation                 | Endpoint                                      | Input                    | Output (`data`)                                                                             |
| ------------------------- | --------------------------------------------- | ------------------------ | ------------------------------------------------------------------------------------------- |
| `list_publications`       | `GET /v3/domain-publications`                 | —                        | array of publication-run records (who / when / status / messages)                           |
| `list_published`          | `GET /v3/domain-publications/published`       | —                        | array of successfully published domains                                                     |
| `get_publication`         | `GET /v3/domain-publications/{id}`            | `id` = run id (`pub_id`) | one publication run; **404** if not found                                                   |
| `publications_for_domain` | `GET /v3/domain-publications/domain/{domain}` | `domain` = slug          | array of runs for that domain — use it to see prior publishes and any run still in progress |

```json
{ "operation": "publications_for_domain", "domain": "products" }
```

### `metadata_by_version` — `GET /v3/domain-info/{domain}/{version}`

Cached per-domain metadata (columns, types, flags, masks, tenants) plus per-system metadata. Read-only.

Inputs: `domain` (slug, required), `version` (positive integer, required). Which version counter this expects is not spelled out in the reference; the config item's `version` from `get_by_slug` is the natural candidate — if the result is empty or 404, use `list_metadata` to see what exists.

Output `200`: `data: { domainInfoCache, domainSystemInfoCache }`. Errors: **403**, **404**.

```json
{ "operation": "metadata_by_version", "domain": "products", "version": 3 }
```

### `list_metadata` — `GET /v3/domain-info`

List domain metadata. Read-only (`domain.list`).

Inputs (all optional): `page` (≥0), `pageSize` (1–100), `search` (substring on slug). Omitting **both** `page` and `pageSize` returns the full list.

Output `200`: `data: { domainInfoList: [...] }` plus `pagination`.

```json
{ "operation": "list_metadata", "search": "prod" }
```

### `delete_published` — `DELETE /v3/domain/{domain}`

⚠️⚠️ **Permanently deletes a published domain and all of its data structures and metadata.** Irreversible. Distinct from `delete_config_item`. **Confirm first with the user naming the exact slug**; first run `publications_for_domain` and stop if a publish is still in progress.

Input: `domain` (slug, required). Output `200`: `{ data, meta, message }` — relay `message`.

| Result                           | HTTP | Code                                 | Action                                                                                              |
| -------------------------------- | ---- | ------------------------------------ | --------------------------------------------------------------------------------------------------- |
| Domain does not exist            | 404  | `DOMAIN_NOT_FOUND`                   | Tell the user; check the slug with `list_published`.                                                |
| A publish is in progress         | 409  | `PUBLISH_IN_FLIGHT`                  | Wait for the run to finish (`publications_for_domain`), then re-confirm before retrying.            |
| Not authorized                   | 403  | `PERMISSION_DENIED`                  | User lacks `domain.delete`.                                                                         |
| Other domains reference this one | 400  | `FK_DEPENDENCY_EXISTS`               | Stop. The referencing domains must be changed first; relationship endpoints are outside this skill. |
| Missing caller identity / slug   | 400  | `MISSING_USER_ID` / `MISSING_DOMAIN` | Supply `domain`; identity is a server-side issue — report it.                                       |

```json
{ "operation": "delete_published", "domain": "products" }
```

## Shared mechanics

**Envelope (REST contract).** Success: `{ data, meta?, status, error: false, message?, pagination? }`. Error: `{ data: null, meta: {}, status, error: true, message, details? }`. Decide success by `error`, then read `message` / `details`. Whether the tool returns this envelope verbatim is unconfirmed — see Prerequisites.

**Status codes lie for platform-state failures.** Request-shape problems on create / update / delete (missing, oversize, or mis-typed fields; id on create; id/type mismatch) return **400** reliably, as do publish `VALIDATION` and the `delete_published` codes. But failures detected inside the platform during save or publish — the `cfg_data` validator (`INVALID`, "Validation failed"), duplicate slug, `IMMUTABLE_SLUG`, item-type change, `CFG_NOT_FOUND` — currently surface as **HTTP 5xx with a precise message**. Never treat a 5xx from `create` / `update` / `publish` as a transient server fault: read `message` and `details` first; most are permanent client-side errors and retrying unchanged will fail again.

**`INVALID` details.** `data.details` is a list of `{ path, code, detail, severity }`. Fix every path (e.g. `cfg_data.schema[2].data_type`) and resend the whole payload.

**Casing.** Requests are snake_case (`cfg_data`, `item_type`, `parent_item_id`); config-item responses are camelCase (`cfgData`, `itemType`). Copy `cfgData` from a read back into `cfg_data` on an update.

**Three paging models.** `list`: 0-based `page` + `pageSize` (1–100) + `fetchType`. `filter`: 1-based `page` + `limit` (≤100). `list_metadata`: 0-based `page` + `pageSize`; omit both for everything. Envelope `pagination.count_mode` is `exact` or `auto`.

**Permissions.** `list` → `list` / `filter` / `list_metadata`; `view` → `get` / `get_by_slug` / publication reads / `metadata_by_version`; `create` → `create`; `change` → `update`; `delete` → `delete_config_item` / `delete_published`; `publish` → `publish`.

## Workflows

**1. Create and publish a new domain**

1. `get_by_slug` — a 404 means the slug is free (a duplicate would otherwise fail at save as a 5xx).
2. Build `cfg_data` with the full platform-required set; `domain_table_name` = slug; every column has `name`, `column_name`, `data_type`, `triggers_version_change`; no reserved or `sys_`/`_`/`p_` names; `archive_policy` if `archive: true`; `track_versions: true` if `xref_enabled: true`.
3. ⚠️ Confirm, then `create` → keep `data.id`.
4. ⚠️ Confirm (user policy), then `publish` → check `statuses.*` and `has_warnings`.
5. Verify: `list_published` or `publications_for_domain`; `metadata_by_version` for the materialized columns.

**2. Change a published domain (add a column, flip a flag)**

1. `get_by_slug` → copy `cfgData`.
2. Edit the copy. Never change `slug` / `domain_table_name`. Never set `track_versions` or `xref_enabled` back to `false`. A new column needs all four required fields.
3. ⚠️ Confirm, then `update` with `id` + the complete `cfg_data`.
4. ⚠️ Confirm (user policy), then `publish`. Until then the live structures still reflect the previous publish.

**3. Diagnose a failed save or publish**

- Message "Validation failed" → walk `data.details` and fix each path.
- Duplicate-slug message → the domain exists; switch to `update`.
- `IMMUTABLE_SLUG` → explain the slug is fixed after publish.
- `CFG_NOT_FOUND` → the slug has no saved config; `list` with `slugContains` to find the right one.
- Publish `200` with `has_warnings: true` → report `step_responses`; `get_publication` with `pub_id` for the run record.

**4. Retire a domain**

1. `publications_for_domain` — no run in progress (else 409 later).
2. ⚠️⚠️ Confirm with the user stating the exact slug, then `delete_published`. Stop on `FK_DEPENDENCY_EXISTS`.
3. Optional, ⚠️ confirm again: `get_by_slug` for `id`, then `delete_config_item`. The reference does not prescribe an order; deleting the published domain first avoids leaving live structures behind with no config record to find them by.

**5. Find and inspect**

- "What domains exist" → `list` (or `filter` with `isDeleted: false`). "Which are published" → `list_published`. "Columns of X" → `get_by_slug` (`cfgData.schema`) or `metadata_by_version`. "Publish history of X" → `publications_for_domain`.

## User phrasing → call

| User says                                                | Call                                                                                                   |
| -------------------------------------------------------- | ------------------------------------------------------------------------------------------------------ |
| "create a products domain with sku, name, price"         | ⚠️ `create` — `slug: "products"`, `cfg_data` with one `schema[]` entry per field                       |
| "add a column / field to the customers domain"           | `get_by_slug` → ⚠️ `update` (`id`, complete `cfg_data`) → offer ⚠️ `publish`                           |
| "rename the domain"                                      | Explain: slug is immutable once published; offer a new domain                                          |
| "use first write wins" / "last write wins"               | ⚠️ `update` — `default_conflict_resolution.code: "fww"` / `"lww"` (or per-field `conflict_resolution`) |
| "turn on version tracking" / "enable xref"               | ⚠️ `update` — `track_versions: true` (+ `xref_enabled: true`); warn it is one-way                      |
| "keep history for a year, max 10 versions"               | ⚠️ `update` — `archive: true`, `archive_policy: { max_record_versions: 10, retention_days: 365 }`      |
| "publish / go live / push my changes"                    | ⚠️ `publish` — `slug`, after confirmation                                                              |
| "did the publish work" / "why did publish fail"          | `publications_for_domain` (`domain`) or `get_publication` (`id` = `pub_id`)                            |
| "is a publish running right now"                         | `publications_for_domain` — look for an in-progress run                                                |
| "show me the domain config / what columns does X have"   | `get_by_slug` (`slug`) — read `cfgData.schema`                                                         |
| "what domains do we have" / "domains matching inventory" | `list` (`slugContains`, `search`, `filterModel`)                                                       |
| "which domains are published"                            | `list_published`                                                                                       |
| "show all publish runs"                                  | `list_publications`                                                                                    |
| "metadata / column types of the published X"             | `metadata_by_version` (`domain`, `version`) or `list_metadata` (`search`)                              |
| "disable / archive the config for X"                     | ⚠️ `delete_config_item` (`id` from `get_by_slug`) — soft delete                                        |
| "delete the domain and its data" / "tear down X"         | ⚠️⚠️ `delete_published` (`domain`) — after the user names the slug                                     |

## Pitfalls

- **`data_type` drift.** The tool's enum allows 9 values (`text`, `numeric`, `boolean`, `timestamptz`, `date`, `uuid`, `integer`, `bigint`, `jsonb`); the platform's exact accepted set (reference §7) has 37 entries including `text[]`, `smallint`, `serial`, `decimal`, `real`, `double precision`, `money`, `time`, `timestamp`, `timestamp with time zone`, `interval`, `inet`, `cidr`, `macaddr`, `macaddr8`, geometric and range types — and spells the timezone type `timestamp with time zone`, not `timestamptz`. Safe set through this tool: `text`, `numeric`, `boolean`, `date`, `uuid`, `integer`, `bigint`, `jsonb`. Treat `timestamptz` as unconfirmed (it may come back as `INVALID`); types outside the tool's enum cannot be sent through this tool at all — tell the user.
- **The tool's `required` lists are looser than the platform's.** Missing `domain_name_singular`, `default_conflict_resolution`, per-column `triggers_version_change`, or `archive_policy` (when `archive: true`) passes the tool and fails at save as a 5xx `INVALID`. Always send the full set.
- **Domain-level `cfg_data.system_access`** is in the tool schema but the reference says it is not part of `cfg_data` (access is governed by the platform's access-control layer). Do not send it; per-column `system_access` inside `schema[]` is honored.
- **5xx is not always a server fault** — see Shared mechanics. Read `message` before retrying anything.
- **Slug length**: request validation allows ≤255, but the domain validator enforces 1–50 — stay ≤50. Reserved prefixes `sys_`, `dvw_`, `dtm_`, `dtv_`.
- **`domain_table_name` must equal `slug` exactly**, and neither can change after publish.
- **One shared `page` property, two bases**: 0-based for `list` / `list_metadata`, 1-based for `filter`.
- **Response casing** is camelCase (`cfgData`, `itemType`); request casing is snake_case.
- **`filter` needs at least one column filter** or it returns 400.
- **`sortModel` / `filterModel`** are structured JSON here; the REST layer takes them JSON-encoded — the tool handles encoding.
- **Omit `version` on `create`**; the platform starts at 1.
- **Publish `200` can still carry warnings** (`has_warnings: true`). Report them; do not call it a clean success.
- **Soft delete ≠ published delete.** `delete_config_item` leaves live data structures; only `delete_published` removes them, permanently.
- **No `X-Tenant-Id`** equivalent on the tool; tenant scope is the server's configuration.
- **Result wrapping unconfirmed** — no `outputSchema`; read the first result before chaining `id` / `pub_id`.
- **Not exposed by this tool**: record read/write over a published domain and data-model/ERD endpoints.
'''
