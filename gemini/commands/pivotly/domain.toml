# Pivotly Domain Management

## Safety / confirmation policy

- **Publish is gated (user policy).** Before `operation: "publish"`, tell the user the slug, whether it has been published before (`publications_for_domain`), and that publishing materializes or refreshes the domain's live data structures (publish → prune → archive). Proceed only on an explicit yes.
- **Every other mutation is confirm-first.** `create` and `update` — show the slug, column list, and flags you are about to send, then ask. `delete_config_item` — say it is a soft delete of the config record only, then ask. ⚠️⚠️ `delete_published` — say it **permanently deletes the published domain and all of its data structures and metadata**, and require the user to state the exact domain slug in their confirmation. Never chain a delete automatically after another step.
- Read operations (`get`, `get_by_slug`, `list`, `filter`, `list_publications`, `list_published`, `get_publication`, `publications_for_domain`, `metadata_by_version`, `list_metadata`) run without asking.
- One-way flags: once `track_versions` or `xref_enabled` is `true` on a published domain it cannot be set back to `false`. Warn before turning either on.
- Never ask for or pass credentials; the MCP server holds the bearer token. Never send an `id` on create, and never send a domain-level `cfg_data.system_access` (see Pitfalls).

## Mental model

- A **domain** is a governed, versioned data entity. You author it as a **config item** (`item_type` = `domain`, identified by a uuid `id` and a human `slug`), then **publish** it to build its data structures. **Saving never changes live data; only publish does.**
- `cfg_data` holds the model: labels, behavior flags (archive, versioning, xref, multi-tenant, dedupe, conflict resolution), and `schema[]` — one entry per column.
- Identity by operation: `id` (config-item uuid) for `update` / `delete_config_item` / `get`; `slug` for `get_by_slug` / `publish`; `domain` (the same slug) for `publications_for_domain` / `metadata_by_version` / `delete_published`; publication-run `id` (`pub_id`) for `get_publication`. `domain_table_name` inside `cfg_data` must equal the slug exactly.
- **Two deletes.** `delete_config_item` soft-deletes the config record (marks it deleted and disabled) and leaves any published data structures in place. `delete_published` permanently drops the published domain, its data structures, and metadata.
- Out of scope for this tool: reading/writing records inside a published domain and data-model/ERD endpoints. Say so if asked.

## Prerequisites

- The Pivotly MCP server is connected and authorized. Authentication is a bearer token held by the server; the caller needs the `domain.<action>` permission for each operation (`list`, `view`, `create`, `change`, `delete`, `publish`); lacking it returns **403**.
- **Tool name:** `config-item_domain` (title "Pivotly domain"). If the client namespaces MCP tools (`mcp__<server>__…`), pick the entry whose unqualified name is `config-item_domain` — the server prefix is not documented in the listing.
- **Tenant context:** the REST API accepts an optional `X-Tenant-Id` header; the tool exposes no tenant parameter. Tenant scope is whatever the server is configured with — undocumented, ask the user if it matters.
- **Result shape is undocumented** (no `outputSchema`). The REST contract returns the envelope in Shared mechanics; whether the tool passes it through verbatim or unwraps `data` is not stated. Read the first result before chaining, and treat both an MCP `isError` result and an envelope with `error: true` as failure.

## Tool: `config-item_domain`

`Pivotly MCP server → config-item_domain`. One tool; `operation` selects the endpoint. `additionalProperties: false` — only the properties below are accepted. Types mirror the `inputSchema`.

