### `cfg_data` (the domain model)

Schema-required means the tool rejects the call without it; **platform-required** means the save validator rejects it (as a 5xx `INVALID`, see Shared mechanics) — always send both sets.

| Field                            | Type                                              | Required                          | Rule                                                                                    |
| -------------------------------- | ------------------------------------------------- | --------------------------------- | --------------------------------------------------------------------------------------- |
| `domain_table_name`              | string                                            | schema + platform                 | **Must equal the config-item `slug` exactly.**                                          |
| `schema`                         | array, `minItems: 1`                              | schema + platform                 | One entry per column; non-empty.                                                        |
| `domain_name_singular`           | string                                            | platform                          | Label for one record, e.g. `Product`.                                                   |
| `default_conflict_resolution`    | `{code: "lww"\|"fww", human_readable?}`           | platform (`code` required)        | `lww` = last write wins, `fww` = first write wins.                                      |
| `archive`                        | boolean                                           | —                                 | Keep historical record versions.                                                        |
| `archive_policy`                 | `{max_record_versions: int, retention_days: int}` | platform **when `archive: true`** | Non-negative integers.                                                                  |
| `track_versions`                 | boolean                                           | —                                 | Version records on change. One-way once published.                                      |
| `xref_enabled`                   | boolean                                           | —                                 | **Requires `track_versions: true`.** One-way once published.                            |
| `multi_tenant`, `dedupe_enabled` | boolean                                           | —                                 |                                                                                         |
| `contact`                        | object                                            | —                                 | Optional; `{name, email, phone}` in the docs' example. Not validated.                   |
| `system_access`                  | array                                             | —                                 | ⚠️ Accepted by the tool but **not part of `cfg_data`** per the reference — do not send. |

Each `schema[]` entry:

| Field                           | Type                                                           | Required                                       | Rule                                                                                                                                               |
| ------------------------------- | -------------------------------------------------------------- | ---------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------------------------- |
| `name`, `column_name`           | string                                                         | schema + platform                              | Not a reserved name; no `sys_`, `_`, or `p_` prefix.                                                                                               |
| `data_type`                     | string enum                                                    | schema + platform                              | Tool enum: `text` `numeric` `boolean` `timestamptz` `date` `uuid` `integer` `bigint` `jsonb`. See Pitfalls for the drift against the platform set. |
| `triggers_version_change`       | boolean                                                        | **platform** (not in the tool's required list) | A change to this field creates a new record version. Always include.                                                                               |
| `description`                   | string                                                         | —                                              |                                                                                                                                                    |
| `indexed`, `unique`, `nullable` | boolean                                                        | —                                              |                                                                                                                                                    |
| `masking`                       | `{masked: boolean, mask_format: string\|null}`                 | —                                              |                                                                                                                                                    |
| `conflict_resolution`           | `{code: "lww"\|"fww", human_readable?}`                        | —                                              | Per-field override of the default.                                                                                                                 |
| `fk_config`                     | object                                                         | —                                              | Foreign-key config, e.g. `{type: "placeholder", config: {}}`.                                                                                      |
| `system_access`                 | array of `{system_slug, read_access?, write_access?, unmask?}` | —                                              | Per-field, per-system overrides; honored.                                                                                                          |

Reserved column names: `id`, `version`, `subversion`, `domain`, `superseded_by_id`, `is_deleted`, `deleted_at`, `version_token`, `last_tx_id`, `created_at`, `modified_at`, `created_by_system`, `modified_by_system`, `tenant_id`, `core_record_id`, `core`, `source_record_ref`, `source_record_ct`, `has_attachment`.

Minimal valid `cfg_data` (authoring convention: set `archive` explicitly so the conditional `archive_policy` rule is unambiguous):

```json
{
  "domain_name_singular": "Product",
  "domain_table_name": "products",
  "default_conflict_resolution": { "code": "lww", "human_readable": "Last Write Wins" },
  "archive": false,
  "schema": [
    {
      "name": "product_number",
      "column_name": "product_number",
      "data_type": "text",
      "triggers_version_change": true,
      "indexed": true,
      "unique": true,
