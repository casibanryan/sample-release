| Slug taken (other type) _(not returned)_                       | **500** | `message` `Slug "<slug>" already exists with item_type "<type>"; cannot save as "data_view".`                                                                                                                                                           | §8.5 (and §8.6 unknown id)              | `data.slug` used by another type.                                                                                                            |
